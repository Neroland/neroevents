modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
logoFile = "neroevents_logo.png"
description = '''
NeroEvents - multiloader build (Forge).
'''

[[mixins]]
config = "neroevents-common.mixins.json"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Neroland Core — required shared foundation; must load BEFORE NeroEvents (ordering = AFTER).
# Core is the ONLY hard dependency: every other Nero mod stays soft and is detected at runtime.
[[dependencies.${mod_id}]]
modId = "nerolandcore"
mandatory = true
versionRange = "${nerolandcore_version_range}"
ordering = "AFTER"
side = "BOTH"

# NeroEconomy — OPTIONAL. Paid features use it when present and fall back when it is absent.
[[dependencies.${mod_id}]]
modId = "neroeconomy"
mandatory = false
versionRange = "[0.4.0-beta.1,)"
ordering = "AFTER"
side = "BOTH"

# Optional siblings, generated from the <x>_compat build flags (floor = the compiled version); empty when off.
${nerospace_dep}${nerocreatures_dep}${nerocolonies_dep}${neroagriculture_dep}${nerofactions_dep}${opac_dep}