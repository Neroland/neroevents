# ----------------------------------------------------------------------------
# NeroEvents cross-loader build — MultiLoader-Template (ModDevGradle + Fabric Loom + ForgeGradle)
#
# Same build layout as the other Neroland mods (Nerospace pattern). Run from the
# repo root with its Gradle 9.6.0 wrapper.
#
# Layout (no architectury-loom):
#   common   -> net.neoforged.moddev, NeoForm-only (de-obfuscated vanilla); spliced into each node
#   fabric   -> net.fabricmc.fabric-loom (omits `mappings` for de-obf 26.x)
#   neoforge -> net.neoforged.moddev (full NeoForge userdev)
#   forge    -> net.minecraftforge.gradle (full Forge userdev)
# common's source is shared into fabric/neoforge/forge (one copy -> no drift).
#
# Version axis = Stonecutter: each loader x MC version is its own node
# (:fabric:26.1.2 :fabric:26.2 :fabric:26.3 :neoforge:26.1.2 :neoforge:26.2 :neoforge:26.3 :forge:26.1.2 :forge:26.2 :forge:26.3).
# ----------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
# ModDevGradle/Loom do not always agree with the configuration cache; off here.
org.gradle.configuration-cache=false

## Mod metadata (shared by all loaders) --------------------------------------
mod_id=neroevents
mod_name=NeroEvents
# The mod version is independent of the Minecraft version; it is the same for all builds.
mod_version=0.5.0-beta.1
mod_group_id=za.co.neroland.neroevents
mod_license=All Rights Reserved (modpacks allowed - see LICENSE)
mod_authors=Neroland

## IDE-active Minecraft default (Stonecutter) --------------------------------
minecraft_version=26.2

## Version matrix (CI iterates these) ---------------------------------------
mc_versions=26.1.2,26.2,26.3

## NeoForm — de-obfuscated vanilla base the `common` module compiles against
neo_form_version_26.1.2=26.1.2-1
neo_form_version_26.2=26.2-2
neo_form_version_26.3=26.3-1

## NeoForge userdev — the `neoforge` module
neo_version_26.1.2=26.1.2.122
neo_version_26.2=26.2.0.93
neo_version_26.3=26.3.0.94

## MinecraftForge / Forge userdev — the `forge` module
forge_version_26.1.2=26.1.2-64.1.5
forge_version_26.2=26.2-65.1.5
forge_version_26.3=26.3-66.0.13

## JEI (mezz.jei, BlameJared maven) — common API recipe-viewer compat
jei_version_26.1.2=29.47.0.111
jei_version_26.2=30.47.0.238
jei_version_26.3=31.16.0.84

## EMI — optional recipe-viewer compat. Official EMI has no MC 26.x release, so this pins the community
## "EMI Unofficial Port (Unstable)" (CurseForge project 1544558, MIT, upstream dev.emi.emi.api unchanged),
## fetched through CurseMaven by CurseForge FILE id. NeoForge + Fabric only; the Forge cells compile
## against the NeoForge file (API only). Dev clients load EMI only with -PwithEmi.
emi_file_neoforge_26.1.2=8630349
emi_file_neoforge_26.2=8616659
emi_file_neoforge_26.3=8897084
emi_file_fabric_26.1.2=8630346
emi_file_fabric_26.2=8616656
emi_file_fabric_26.3=8897080

## Fabric (https://fabricmc.net/develop) ------------------------------------
fabric_loader_version=0.20.0
fabric_api_version_26.1.2=0.155.3+26.1.2
fabric_api_version_26.2=0.161.0+26.2
fabric_api_version_26.3=0.164.0+26.3

## Neroland Core — shared foundation library (required dependency, loads BEFORE NeroEvents).
## Consumed per-loader as za.co.neroland.nerolandcore:nerolandcore-<loader>-<mc>:<this>. Resolved from
## mavenLocal() or the NerolandCoreGitHubPackages maven declared in stonecutter.gradle. The manifest
## floor is this pinned version (floor = compiled Core version) so the loader refuses a Core too old
## to have the APIs NeroEvents compiles against (config schema, offline-capable progression gates, sourced
## threshold crossings — Core 1.15.0).
nerolandcore_version=1.15.0

## NeroEconomy — OPTIONAL. Compiled `compileOnly` against its API jar (never bundled, never required);
## one bridge class touches it, and only after isModLoaded("neroeconomy"). Resolved from mavenLocal() or the
## NeroEconomy GitHub Packages maven (declared in stonecutter.gradle only when credentials are present).
## Dev clients load it only with -PwithNeroEconomy, so the default run proves NeroEvents works without it.
neroeconomy_version=0.4.0-beta.1

## Optional siblings - compileOnly behind compat facades (compat/<x>/<X>Compat): one bridge class per sibling imports
## it, found through a META-INF/services seam after isModLoaded. -PwithNerospace, -PwithNeroCreatures,
## -PwithNeroColonies, -PwithNeroAgriculture, -PwithNeroFactions load one into a dev run. <x>_compat=false excludes the
## bridge class, its META-INF/services line and the manifest entry, for a build where the artifact does not resolve.
## Each is resolved as za.co.neroland.<id>:<id>-<loader>-<mc>:<version> from mavenLocal() or that mod's GitHub Packages
## maven (declared in stonecutter.gradle only when credentials are present). Manifest floors = these compiled versions.
nerospace_version=1.5.1
# The nerospace artifact does not resolve from mavenLocal() or GitHub Packages on this machine yet: off until it is
# published (the façade, payloads and tests do not need it). Flip to true once it resolves.
nerospace_compat=false
nerocreatures_version=0.3.0-alpha.1
# The nerocreatures artifact does not resolve from mavenLocal() or GitHub Packages on this machine yet: off until it is
# published (the façade, payloads and tests do not need it). Flip to true once it resolves.
nerocreatures_compat=false
nerocolonies_version=0.5.0-beta.1
nerocolonies_compat=true
neroagriculture_version=0.5.0-beta.1
# The neroagriculture artifact does not resolve from mavenLocal() or GitHub Packages on this machine yet: off until it is
# published (the façade, payloads and tests do not need it). Flip to true once it resolves.
neroagriculture_compat=false
nerofactions_version=0.5.0-beta.1
# Off until NeroFactions is tagged and published: faction wars compile and test without it, and the bridge is
# excluded from the jar. Flip to true for a build against a published (or mavenLocal) NeroFactions artifact.
nerofactions_compat=false

## Open Parties and Claims - OPTIONAL, claims only ever deny (xaero.pac, https://chocolateminecraft.com/maven;
## LGPL-3.0; compileOnly against the common API jar). -PwithOpac loads it into a NeoForge dev run.
opac_version_26.1.2=0.32.7
opac_version_26.2=0.32.7
opac_version_26.3=0.32.8
opac_compat=true
