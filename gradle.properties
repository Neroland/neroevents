## Neroland Core — shared foundation library (required dependency, loads BEFORE NeroEvents).
## Consumed per-loader as za.co.neroland.nerolandcore:nerolandcore-<loader>-<mc>:<this>. Resolved from
## mavenLocal() or the NerolandCoreGitHubPackages maven declared in stonecutter.gradle. The manifest
## floor is this pinned version (floor = compiled Core version) so the loader refuses a Core too old
## to have the APIs NeroEvents compiles against (config schema, offline-capable progression gates, sourced
## threshold crossings — Core 1.15.0; the 1.21.x builds — Core 1.17.0).
nerolandcore_version=1.17.0

## NeroEconomy — OPTIONAL. Compiled `compileOnly` against its API jar (never bundled, never required);
## one bridge class touches it, and only after isModLoaded("neroeconomy"). Resolved from mavenLocal() or the
## NeroEconomy GitHub Packages maven (declared in stonecutter.gradle only when credentials are present).
## Dev clients load it only with -PwithNeroEconomy, so the default run proves NeroEvents works without it.
neroeconomy_version=0.5.0-beta.1

## Optional siblings - compileOnly behind compat facades (compat/<x>/<X>Compat): one bridge class per sibling imports
## it, found through a META-INF/services seam after isModLoaded. -PwithNerospace, -PwithNeroCreatures,
## -PwithNeroColonies, -PwithNeroAgriculture, -PwithNeroFactions load one into a dev run. <x>_compat=false excludes the
## bridge class, its META-INF/services line and the manifest entry, for a build where the artifact does not resolve.
## Each is resolved as za.co.neroland.<id>:<id>-<loader>-<mc>:<version> from mavenLocal() or that mod's GitHub Packages
## maven (declared in stonecutter.gradle only when credentials are present). Manifest floors = these compiled versions.
## <x>_compat_<mc>=false switches one sibling off for one Minecraft version only (a sibling with no build for that
## line yet); the rest of the matrix keeps it.
nerospace_version=2.0.1
nerospace_compat=true
nerocreatures_version=0.3.0-alpha.1
# The nerocreatures artifact does not resolve from mavenLocal() or GitHub Packages on this machine yet: off until it is
# published (the façade, payloads and tests do not need it). Flip to true once it resolves.
nerocreatures_compat=false
nerocolonies_version=0.6.1-beta.1
nerocolonies_compat=true
neroagriculture_version=0.5.0-beta.1
# The neroagriculture artifact does not resolve from mavenLocal() or GitHub Packages on this machine yet: off until it is
# published (the façade, payloads and tests do not need it). Flip to true once it resolves.
neroagriculture_compat=false
nerofactions_version=0.5.0-beta.1
# Off until NeroFactions is tagged and published: faction wars compile and test without it, and the bridge is
# excluded from the jar. Flip to true for a build against a published (or mavenLocal) NeroFactions artifact.
nerofactions_compat=false

## Open Parties and Claims - OPTIONAL, claims only ever deny (xaero.pac, https://chocolateminecraft.com/maven;
## LGPL-3.0; compileOnly against the common API jar). -PwithOpac loads it into a NeoForge dev run.
opac_version_1.21.1=0.33.0
opac_version_1.21.4=0.31.6
opac_version_1.21.5=0.31.6
opac_version_1.21.8=0.33.0
opac_version_1.21.10=0.33.0
opac_version_1.21.11=0.33.0
opac_version_26.1.2=0.32.7
opac_version_26.2=0.32.7
opac_version_26.3=0.32.8
opac_compat=true
